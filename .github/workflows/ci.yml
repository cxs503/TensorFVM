name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.10; 3.11 and 3.12 are what
        # the torch wheels are tested against upstream.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install the optional gmsh mesh runtime
        # gmsh is an optional extra and needs libGLU.  The affected tests skip
        # when it cannot load, so a failure here degrades to a skip instead of
        # failing the job.
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa
          pip install "gmsh>=4.12"
      - name: Run tests
        # --timeout activates pytest-timeout so a hung solver fails the job
        # instead of burning the runner limit.
        run: pytest -q --timeout=1800 --cov=tensorfvm --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    # SCOPE OF THIS GATE: regression-scoped, not tree-wide.
    #
    # The tree carries a large *pre-existing* ruff backlog (~9.9k findings,
    # dominated by E701/E702 semicolon-packed statements) and ~590 files that
    # `ruff format` would rewrite.  A tree-wide gate therefore can never turn
    # green, whatever a PR does, and it blocks the merge queue for everyone
    # (TensorFVM #114 / TensorFEM #44 both stalled on it while their own diffs
    # were clean).  So: `ruff` now gates the Python files this event actually
    # changes, and the tree-wide count stays visible as an advisory, non-gating
    # step below so the backlog can still be measured and burned down.
    #
    # The job name is intentionally kept as "lint (advisory)" so any branch
    # protection rule that names this check keeps matching; the job itself can
    # now fail (there is no job-level continue-on-error any more).
    steps:
      - uses: actions/checkout@v4
        with:
          # Full commit/tree history is needed for the merge-base, but no file
          # contents: blob:none keeps the clone small (the history holds ~1.2GiB
          # of archived field data) while `git diff --name-only` still works.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Determine the lint scope (Python files changed by this event)
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # merge-base, not the base tip: only the PR's own changes are
            # gated, never files main moved independently.
            base="$(git merge-base "refs/remotes/origin/${{ github.base_ref }}" HEAD || true)"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "$zero" ] \
               && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "lint base: $base ($(git log -1 --format=%h "$base"))"
          git diff --name-only --diff-filter=ACMR "$base" HEAD -- src tests scripts \
            | grep -E '\.py$' > /tmp/lint_scope.txt || true
          echo "changed Python files in scope: $(wc -l < /tmp/lint_scope.txt)"
          sed 's/^/  /' /tmp/lint_scope.txt
      - name: Lint changed files (ruff)
        run: |
          set -euo pipefail
          if [ ! -s /tmp/lint_scope.txt ]; then
            echo "no Python files changed by this event: nothing to lint"
            exit 0
          fi
          mapfile -t files < /tmp/lint_scope.txt
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"
      - name: Pre-existing tree-wide backlog (advisory, never gates)
        continue-on-error: true
        run: |
          ruff check src tests scripts --statistics | tail -15 || true
          ruff format --check src tests scripts | tail -3 || true