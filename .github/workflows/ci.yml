name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.10; 3.11 and 3.12 are what
        # the torch wheels are tested against upstream.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install the optional gmsh mesh runtime
        # gmsh is an optional extra and needs libGLU.  The affected tests skip
        # when it cannot load, so a failure here degrades to a skip instead of
        # failing the job.
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa
          pip install "gmsh>=4.12"
      - name: Run tests
        # --timeout activates pytest-timeout so a hung solver fails the job
        # instead of burning the runner limit.
        run: pytest -q --timeout=1800 --cov=tensorfvm --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    # The tree still carries a large pre-existing ruff backlog (F401/F841/
    # E501/E702 and 550+ unformatted files).  Auditing that backlog is a
    # separate job, so the checks below stay advisory -- but the flag lives on
    # the *steps*, not on the job: a job-level `continue-on-error` still
    # reports the job (and therefore its check run) as failed, which blocks the
    # merge gate and hides every other signal.  Exactly one step is blocking:
    # the ratchet that keeps *newly added* files clean, so the backlog can only
    # shrink from here on.
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 gives the ratchet below a merge base to diff against
          # on push events; pull_request events use the base sha directly.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff) -- full tree, advisory
        continue-on-error: true
        run: ruff check src tests scripts
      - name: Format check (ruff format) -- full tree, advisory
        continue-on-error: true
        run: ruff format --check src tests scripts
      - name: Record lint debt in the job summary
        if: always()
        run: |
          {
            echo "### ruff debt (advisory)"
            echo
            echo "Baseline is not gated; only *newly added* files must be clean."
            echo
            echo '```'
            ruff check src tests scripts --statistics || true
            echo '```'
            echo
            echo -n "Unformatted files: "
            ruff format --check src tests scripts 2>/dev/null | grep -c 'Would reformat' || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Lint newly added files (blocking ratchet)
        # New files are entirely the author's responsibility, so they get the
        # blocking treatment without touching the legacy backlog.  Edits to
        # existing files stay advisory (they inherit pre-existing violations).
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            BASE=$(git merge-base origin/main HEAD || true)
          fi
          if [ -z "$BASE" ]; then
            echo "No merge base available; skipping the ratchet."
            exit 0
          fi
          files=$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- \
                    'src' 'tests' 'scripts' | grep -E '\.py$' || true)
          if [ -z "$files" ]; then
            echo "No Python files added; nothing to ratchet."
            exit 0
          fi
          echo "$files"
          ruff check $files
          ruff format --check $files