name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.10; 3.11 and 3.12 are what
        # the torch wheels are tested against upstream.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install the optional gmsh mesh runtime
        # gmsh is an optional extra and needs libGLU.  The affected tests skip
        # when it cannot load, so a failure here degrades to a skip instead of
        # failing the job.
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa
          pip install "gmsh>=4.12"
      - name: Run tests
        # --timeout activates pytest-timeout so a hung solver fails the job
        # instead of burning the runner limit.
        run: pytest -q --timeout=1800 --cov=tensorfvm --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    # Was `continue-on-error: true` because ruff had no configuration in this
    # repo: CI ran the *default* rule set over the whole tree and measured a
    # ~9,900-finding legacy backlog (E702 x7634, E701 x1852, F401 x98, ...) plus
    # a tree `ruff format` would rewrite, so the check was red by construction on
    # every pull request while carrying no signal.
    #
    # The backlog is now split into a gate and a report:
    #   * blocking -- `ruff check` over the correctness families declared in
    #     [tool.ruff.lint] of pyproject.toml (E9/F63/F7/F82). Those measure zero
    #     findings tree-wide today, so the gate is satisfiable and a red result
    #     means a real regression;
    #   * informational -- the layout/pyflakes backlog and the formatting check,
    #     both reported without failing the run until the formatting campaign
    #     lands.
    # The job name is kept unchanged for continuity with the check-run accounting
    # that already watches it.
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the changed-file ratchet can diff against the PR base.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff, correctness gate)
        # Blocking half of the gate; rule set from [tool.ruff.lint].
        run: ruff check src tests scripts
      - name: Lint ratchet (touched files must stay clean)
        # Stricter than the gate -- E9 plus all of pyflakes -- over the files a
        # change touches, so new code cannot grow the backlog. Informational for
        # now: a PR that edits a legacy file must not turn red for debt it did
        # not create.
        continue-on-error: true
        run: python scripts/lint_ratchet.py --base "origin/${{ github.base_ref || 'main' }}"
      - name: Backlog report (informational)
        continue-on-error: true
        run: python scripts/lint_ratchet.py --report
      - name: Format check (ruff format, informational)
        # 560 of 562 files would be reformatted: the house style is dense
        # (semicolon-packed kernels, one-line test bodies). Informational until
        # the formatting campaign lands, then this becomes a gate too.
        continue-on-error: true
        run: ruff format --check src tests scripts
