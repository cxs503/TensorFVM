name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.10; 3.11 and 3.12 are what
        # the torch wheels are tested against upstream.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install the optional gmsh mesh runtime
        # gmsh is an optional extra and needs libGLU.  The affected tests skip
        # when it cannot load, so a failure here degrades to a skip instead of
        # failing the job.
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa
          pip install "gmsh>=4.12"
      - name: Run tests
        # --timeout activates pytest-timeout so a hung solver fails the job
        # instead of burning the runner limit.
        run: pytest -q --timeout=1800 --cov=tensorfvm --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    # Advisory on purpose: the tree carries a large pre-existing ruff backlog
    # (unused imports, import ordering, semicolon-packed statements).  Making
    # it blocking would hide every other signal.  Fix the backlog, then drop
    # this continue-on-error and promote it to a gate.
    #
    # The checks are scoped to the Python files this change set touches
    # (scripts/ci/lint_changed.sh, a ratchet).  A whole-tree
    # `ruff check src tests scripts` is red by construction -- 9822 findings and
    # 554 unformatted files predate this workflow -- so it fails even for a
    # docs-only pull request and reports nothing about the change under test.
    # The ratchet keeps new debt out while the historic backlog is swept.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The ratchet diffs against the base commit of this change set
          # (pull_request.base.sha / event.before), so the runner needs history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint changed files (ruff ratchet)
        # Green when the change set touches no Python file; red when a touched
        # file is unclean under `ruff check` or `ruff format --check`.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash scripts/ci/lint_changed.sh
