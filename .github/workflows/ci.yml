name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.10; 3.11 and 3.12 are what
        # the torch wheels are tested against upstream.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install the optional gmsh mesh runtime
        # gmsh is an optional extra and needs libGLU.  The affected tests skip
        # when it cannot load, so a failure here degrades to a skip instead of
        # failing the job.
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa
          pip install "gmsh>=4.12"
      - name: Run tests
        # --timeout activates pytest-timeout so a hung solver fails the job
        # instead of burning the runner limit.
        run: pytest -q --timeout=1800 --cov=tensorfvm --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    # Advisory on purpose: the tree carries a large pre-existing ruff backlog
    # (unused imports, import ordering, semicolon-packed statements).  Making
    # it blocking would hide every other signal.  Drop this continue-on-error
    # once `ruff check src tests scripts` is clean tree-wide.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The ratchet step diffs against origin/main, so it needs the merge
          # base; the default shallow checkout does not have one.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pin the linter
        # ruff floats in via the dev extra.  0.17.0 shipped a documented
        # breaking change to line-length accounting (trailing pragma comments
        # are now ignored), so a tree formatted with one release fails
        # `ruff format --check` under another.  The pin is the release the
        # gate is calibrated against; bump it together with a ratchet re-run
        # (see docs/ci-lint-policy.md).  pyproject pins the same release.
        run: python -m pip install "ruff==0.15.0"
      - name: Lint fatal rules (whole tree)
        # Rules whose findings are actual defects (syntax errors, undefined
        # names, broken comparisons, invalid escape sequences) are clean
        # tree-wide, so they stay a whole-tree gate: they cannot be dodged by
        # only linting touched files.
        run: ruff check --select E9,F63,F7,F82 src tests scripts
      - name: Lint + format ratchet (changed Python only)
        # The pre-existing style backlog is not gateable without reformatting
        # the whole tree (see docs/ci-lint-policy.md), so style rules apply to
        # the files a change actually touches: new code cannot add findings.
        run: |
          git fetch --no-tags origin main
          python scripts/ci_lint_ratchet.py --base origin/main