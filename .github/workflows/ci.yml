name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.10; 3.11 and 3.12 are what
        # the torch wheels are tested against upstream.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install the optional gmsh mesh runtime
        # gmsh is an optional extra and needs libGLU.  The affected tests skip
        # when it cannot load, so a failure here degrades to a skip instead of
        # failing the job.
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa
          pip install "gmsh>=4.12"
      - name: Run tests
        # --timeout activates pytest-timeout so a hung solver fails the job
        # instead of burning the runner limit.
        run: pytest -q --timeout=1800 --cov=tensorfvm --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    # Was `continue-on-error: true` because the tree carries a large pre-existing
    # ruff backlog (E702 x7634, E701 x1852, ... see the note in pyproject.toml).
    # The gate is now blocking, but only on the rule families that are already
    # clean tree-wide (correctness: E9/F63/F7/F82, configured in
    # [tool.ruff.lint]), and `scripts/lint_ratchet.py` additionally holds every
    # file touched by a change to the full pyflakes set, so the remaining
    # backlog can only shrink.  The job name is kept unchanged for continuity
    # with the check-run accounting that already watches it.
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the ratchet can diff against the PR's merge base.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff, correctness gate)
        # Rule set comes from [tool.ruff.lint].select in pyproject.toml; this is
        # the blocking half of the gate.
        run: ruff check src tests scripts
      - name: Lint ratchet (changed files must not grow the backlog)
        # Wider rule set (all of pyflakes + E9) applied to the files a PR
        # touches.  Falls back to the last commit when the base ref cannot be
        # resolved, so a local/fork run never hard-fails for setup reasons.
        if: github.event_name == 'pull_request'
        run: python scripts/lint_ratchet.py --base "origin/${{ github.base_ref }}"
      - name: Backlog report (informational)
        # Never fails: keeps the remaining debt visible without blocking.
        continue-on-error: true
        run: python scripts/lint_ratchet.py --report
      - name: Format check (ruff format, informational)
        # 585 of 587 files would be reformatted today: the house style is dense
        # (semicolon-packed kernels, one-line test bodies).  Informational until
        # the formatting campaign lands, then becomes a gate too.
        continue-on-error: true
        run: ruff format --check src tests scripts