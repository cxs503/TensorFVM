name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TORCH_DEVICE_BACKEND_AUTOLOAD: "0"

jobs:
  test:
    name: test (py311)
    runs-on: ci-loong64
    steps:
      - uses: actions/checkout@v4
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install the optional gmsh mesh runtime
        # gmsh is an optional extra and needs libGLU.  The affected tests skip
        # when it cannot load, so a failure here degrades to a skip instead of
        # failing the job.
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa
          pip install "gmsh>=4.12"
      - name: Run tests
        # --timeout activates pytest-timeout so a hung solver fails the job
        # instead of burning the runner limit.
        run: pytest -q --timeout=1800 --cov=tensorfvm --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py311
          path: coverage.xml

  lint:
    name: lint (advisory)
    runs-on: ci-loong64
    # The enforced rule set is declared in pyproject.toml ([tool.ruff.lint]):
    # E4 (import syntax) + E9 (syntax errors) + F (pyflakes correctness).  The
    # whole tree satisfies it since PR #109, so this job is expected to be green;
    # keep continue-on-error for one release cycle, then drop it to promote the
    # job to a gate.
    #
    # ruff is pinned in the `dev` extra (ruff>=0.15,<0.16) so the gate cannot
    # drift underneath a stale branch.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests scripts
      # No `ruff format --check` step: this repository never adopted ruff-format's
      # canonical layout.  Numeric fixtures and short solver helpers are written
      # as dense one-statement-per-line chains on purpose, so `ruff format` would
      # rewrite 554 of 556 tracked Python files (measured on PR #109, ruff 0.15.0)
      # and bury every real diff.  Re-introduce the step per module after a
      # dedicated mechanical reformat lands; see docs/pr109-lint-gate/report.md.
