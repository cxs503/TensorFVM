name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.10; 3.11 and 3.12 are what
        # the torch wheels are tested against upstream.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install the optional gmsh mesh runtime
        # gmsh is an optional extra and needs libGLU.  The affected tests skip
        # when it cannot load, so a failure here degrades to a skip instead of
        # failing the job.
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa
          pip install "gmsh>=4.12"
      - name: Run tests
        # --timeout activates pytest-timeout so a hung solver fails the job
        # instead of burning the runner limit.
        run: pytest -q --timeout=1800 --cov=tensorfvm --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    # Job name kept as "lint (advisory)" for continuity with the check-runs
    # already recorded on open PRs.
    name: lint (advisory)
    runs-on: ubuntu-latest
    # The *whole-tree* ruff signal is advisory on purpose: the tree carries a
    # large pre-existing backlog (~9.4k E701/E702 semicolon-packed statements,
    # 554 files off the `ruff format` style), so a whole-tree gate could never
    # go green and stopped carrying information.  Advisory is expressed per
    # *step* (`continue-on-error` on the step), not per job: a job-level
    # `continue-on-error` keeps the workflow run green but leaves the job's
    # check-run conclusion at "failure", which is what every PR reported as a
    # red `lint (advisory)` check.  What is gated here is the *ratchet*: the
    # .py files a PR itself touches must be clean under `ruff check` *and*
    # `ruff format`, so new debt cannot enter and the backlog cannot grow.
    # Drop the two advisory steps once the backlog reaches zero.
    steps:
      - uses: actions/checkout@v4
        with:
          # The ratchet diffs the PR head against its base branch, so the base
          # ref (and not just the head commit) has to be fetched.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint changed files (ruff, ratchet gate)
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          git rev-parse --verify "$base"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base...HEAD" -- '*.py')
          if [ ${#files[@]} -eq 0 ]; then
            echo "no changed .py files: ratchet gate has nothing to verify"
            exit 0
          fi
          printf 'ratchet input: %s\n' "${files[@]}"
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"
      # Push events are covered by the pusher-side ruff pre-gate, which lints
      # exactly the changed .py files of the commit it is about to push.
      - name: Lint (ruff, whole tree, advisory)
        continue-on-error: true
        run: ruff check src tests scripts
      - name: Format check (ruff format, whole tree, advisory)
        continue-on-error: true
        run: ruff format --check src tests scripts
