name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.10; 3.11 and 3.12 are what
        # the torch wheels are tested against upstream.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install the optional gmsh mesh runtime
        # gmsh is an optional extra and needs libGLU.  The affected tests skip
        # when it cannot load, so a failure here degrades to a skip instead of
        # failing the job.
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa
          pip install "gmsh>=4.12"
      - name: Run tests
        # --timeout activates pytest-timeout so a hung solver fails the job
        # instead of burning the runner limit.
        run: pytest -q --timeout=1800 --cov=tensorfvm --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: lint
    runs-on: ubuntu-latest
    # Blocking gate since 2026-11-05.  The backlog that forced the advisory
    # mode is resolved two ways: the policy in pyproject.toml [tool.ruff]
    # codifies the tree's house style (E701/E702/E703/E731/E741 are not
    # enforced, see docs/lint-gate.md), and the remaining real findings
    # (F401/E401/F541) were fixed.  A frozen per-file F841 baseline keeps the
    # rest of the F rules live, so *new* dead code fails here.
    # tests/test_lint_gate.py re-runs this check inside the test job, so the
    # policy cannot drift away from the CI step.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff check) — blocking
        run: ruff check src tests scripts
      - name: Format check (ruff format) — advisory
        # 555 of 557 files predate `ruff format`; the whole-tree reformat is
        # tracked as a separate mechanical change (docs/lint-gate.md).  Kept
        # visible in the log but non-blocking so the formatting debt cannot
        # mask the lint gate above.
        continue-on-error: true
        run: ruff format --check src tests scripts
