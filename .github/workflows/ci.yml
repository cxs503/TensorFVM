name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.10; 3.11 and 3.12 are what
        # the torch wheels are tested against upstream.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install the optional gmsh mesh runtime
        # gmsh is an optional extra and needs libGLU.  The affected tests skip
        # when it cannot load, so a failure here degrades to a skip instead of
        # failing the job.
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa
          pip install "gmsh>=4.12"
      - name: Run tests
        # --timeout activates pytest-timeout so a hung solver fails the job
        # instead of burning the runner limit.
        run: pytest -q --timeout=1800 --cov=tensorfvm --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    # Advisory on purpose: the tree carries a large pre-existing ruff backlog
    # (~9.8k findings, ~550 files ruff-format would rewrite).  Making it
    # blocking would hide every other signal.
    #
    # The advisory semantics are expressed on the STEPS, never on the job.
    # A job-level `continue-on-error: true` only keeps the workflow *run*
    # green: the job is still published as a failed check run, so every
    # pull request reports "lint (advisory) = failure" and any merge gate
    # keyed on check-run conclusions goes red over debt the PR did not
    # create.  A step-level `continue-on-error: true` keeps the finding
    # visible (red step, annotation, counts in the run summary) while the
    # job/check-run conclusion stays success.
    #
    # Promotion path: clear the backlog, then delete the three per-step
    # `continue-on-error` flags below to make this a gate.  See
    # docs/ci-lint-advisory/README.md.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Backlog snapshot (advisory)
        # Keeps the debt measurable in the run summary even while green, so
        # "advisory" never degrades into "invisible".
        continue-on-error: true
        run: |
          {
            echo "### ruff backlog (advisory, non-blocking)"
            echo ""
            echo "Counts must be driven down before the lint job can become a gate."
            echo ""
            echo '```'
            ruff check src tests scripts --statistics 2>&1 | tail -25 || true
            echo '```'
            echo ""
            echo '```'
            ruff format --check src tests scripts 2>&1 | tail -3 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Lint (ruff)
        continue-on-error: true
        run: ruff check src tests scripts
      - name: Format check (ruff format)
        continue-on-error: true
        run: ruff format --check src tests scripts