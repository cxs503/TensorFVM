[project]
name = "tensorfvm"
version = "0.1.0"
description = "PyTorch finite-volume SIMPLE solver for two-dimensional cylinder flow"
readme = "README.rst"
requires-python = ">=3.10"
dependencies = ["torch>=2.14.1"]

[project.scripts]
tensorfvm-cylinder = "tensorfvm.cylinder:main"

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"
