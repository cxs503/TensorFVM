[project]
name = "tensorfvm"
version = "0.1.0"
description = "PyTorch finite-volume incompressible-flow solvers with experimental distributed 3-D support"
readme = "README.rst"
requires-python = ">=3.10"
dependencies = ["torch>=2.7"]

[project.scripts]
tensorfvm-benchmark = "tensorfvm.verification.__main__:main"
tensorfvm-cylinder = "tensorfvm.cylinder:main"
tensorfvm-benchmark-dfg = "tensorfvm.benchmark_dfg:main"
tensorfvm-benchmark-airfoil = "tensorfvm.benchmark_airfoil:main"
tensorfvm-benchmark-flat-plate = "tensorfvm.benchmark_flat_plate:main"
tensorfvm-benchmark-cylinder-urans = "tensorfvm.benchmark_cylinder_urans:main"
tensorfvm-benchmark-30p30n = "tensorfvm.benchmark_30p30n:main"
tensorfvm-benchmark-cylinder-3d = "tensorfvm.benchmark_cylinder3d:main"
tensorfvm-mesh-cylinder-3d = "tensorfvm.mesh_cylinder3d:main"

[tool.setuptools.package-data]
tensorfvm = ["data/30p30n/*.dat", "data/30p30n/README.rst", "data/30p30n-nominal/*", "data/30p30n-hlpw4/*.dat", "data/30p30n-hlpw4/*.json", "data/30p30n-hlpw4/original/*.txt", "data/30p30n-hlpw4/original/Geometry/*", "data/30p30n-hlpw4/original/Exp_Data_LTPT_Re9million/*"]

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
benchmark = ["numpy>=1.24", "matplotlib>=3.7", "scipy>=1.11"]
mesh = ["gmsh>=4.12"]
amg = ["numpy>=1.24", "scipy>=1.11", "pyamg>=5.3"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "pytest-cov>=5.0", "ruff>=0.6", "numpy>=1.24", "matplotlib>=3.7", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
# Ruff had no configuration here, so CI ran the *default* rule set over the whole
# tree and measured a ~9,900-finding legacy backlog it could never clear; the
# job was `continue-on-error`, so it carried no signal while still showing up as
# a red check on every pull request. The enforced set is now declared.
target-version = "py310"

[tool.ruff.lint]
# Blocking tree-wide half of the CI lint gate (see .github/workflows/ci.yml,
# job "lint (advisory)"): correctness only. These families measure zero findings
# on `src tests scripts` at adoption time, so the gate is satisfiable and future
# reds are real regressions.
#   E9  -> syntax errors / invalid constructs (E901..E999)
#   F63 -> invalid comparisons (`is` against a literal, ...)
#   F7  -> pyflakes correctness bugs (`break` outside a loop, ...)
#   F82 -> undefined names (F821..F823)
# Reproduction: `ruff check src tests scripts` -> "All checks passed!".
select = ["E9", "F63", "F7", "F82"]

# Measured backlog at adoption (ruff 0.15, `ruff check --isolated --statistics
# src tests scripts`): E702 x7605, E701 x1852, F401 x98, E401 x84, E731 x69,
# F841 x50, E402 x39, E741 x20, F541 x6, E703 x3; `ruff format --check` would
# reformat 556 of 558 files. Clearing that is a layout/formatting campaign, not a
# gate: the house style is dense on purpose (semicolon-packed kernels, one-line
# test bodies), so E1/E2/E3/E4/E7 and the F-layout families stay out of the
# blocking set until the campaign lands. `scripts/lint_ratchet.py` applies the
# full pyflakes set to the files a change touches, and a family moves into
# `select` above once its tree-wide count reaches zero.
