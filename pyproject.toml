[project]
name = "tensorfvm"
version = "0.1.0"
description = "PyTorch finite-volume incompressible-flow solvers with experimental distributed 3-D support"
readme = "README.rst"
requires-python = ">=3.10"
dependencies = ["torch>=2.7"]

[project.scripts]
tensorfvm-benchmark = "tensorfvm.verification.__main__:main"
tensorfvm-cylinder = "tensorfvm.cylinder:main"
tensorfvm-benchmark-dfg = "tensorfvm.benchmark_dfg:main"
tensorfvm-benchmark-airfoil = "tensorfvm.benchmark_airfoil:main"
tensorfvm-benchmark-flat-plate = "tensorfvm.benchmark_flat_plate:main"
tensorfvm-benchmark-cylinder-urans = "tensorfvm.benchmark_cylinder_urans:main"
tensorfvm-benchmark-30p30n = "tensorfvm.benchmark_30p30n:main"
tensorfvm-benchmark-cylinder-3d = "tensorfvm.benchmark_cylinder3d:main"
tensorfvm-mesh-cylinder-3d = "tensorfvm.mesh_cylinder3d:main"

[tool.setuptools.package-data]
tensorfvm = ["data/30p30n/*.dat", "data/30p30n/README.rst", "data/30p30n-nominal/*", "data/30p30n-hlpw4/*.dat", "data/30p30n-hlpw4/*.json", "data/30p30n-hlpw4/original/*.txt", "data/30p30n-hlpw4/original/Geometry/*", "data/30p30n-hlpw4/original/Exp_Data_LTPT_Re9million/*"]

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
benchmark = ["numpy>=1.24", "matplotlib>=3.7", "scipy>=1.11"]
mesh = ["gmsh>=4.12"]
amg = ["numpy>=1.24", "scipy>=1.11", "pyamg>=5.3"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "pytest-cov>=5.0", "ruff>=0.6", "numpy>=1.24", "matplotlib>=3.7", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Blocking CI gate (see .github/workflows/ci.yml, job "lint").  The tree carries
# a large, deliberately dense house style (semicolon-packed kernels, one-line
# test bodies), so the enforced set is restricted to correctness rules that are
# already clean tree-wide:
#   E9  -> syntax / runtime errors (E901..E999)
#   F63 -> invalid comparison, F7 -> real pyflakes bugs (redefinition, ...),
#   F82 -> undefined name
# Local check: `ruff check src tests scripts` -> 0 errors.
select = ["E9", "F63", "F7", "F82"]

# Families still in the backlog (measured 2026-11-05 with
# `ruff check --isolated src tests scripts --statistics`): E702 x7634,
# E701 x1852, F401 x111, E401 x84, E731 x71, F841 x54, E402 x40, E741 x20,
# F541 x6, E703 x3; `ruff format --check` would reformat 585 of 587 files.
# The E1/E2/E3/E4/E7 layout families need a formatting campaign rather than a
# gate; the pyflakes families (F) are enforced on *changed* files by
# scripts/lint_ratchet.py so new code cannot grow the backlog while it is paid
# down.  Adopt a family tree-wide once its count reaches zero.
